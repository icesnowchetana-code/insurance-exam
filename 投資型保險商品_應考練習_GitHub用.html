<style>
:root{

*{box-sizing:border-box;}
body{

.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:6px;}

.btn{

.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.tag{display:inline-block;font-size:12px;padding:3px 9px;border-radius:3px;background:var(--gold-dim);color:#5C4521;font-weight:700;}
.hidden{display:none !important;}
.seal-badge{

}
.seal-badge.pass{border-color:var(--jade);color:var(--jade);}
.chapter-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);}
.chapter-row:last-child{border-bottom:none;}
.chapter-name{flex:0 0 150px;font-size:13px;color:var(--slate);}
.bar-track{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden;position:relative;}
.bar-fill{height:100%;border-radius:6px;}
.bar-val{flex:0 0 38px;text-align:right;font-size:13px;font-weight:700;}
.opt{
  display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:9px;
  border:1.5px solid var(--line);border-radius:5px;background:var(--paper-raised);
  font-family:inherit;font-size:15px;color:var(--ink);cursor:pointer;

.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--navy);background:#EFEAF5;}
.opt.correct{border-color:var(--jade);background:var(--jade-bg);}
.opt.wrong{border-color:var(--seal);background:var(--seal-bg);}
.opt.disabled-look{cursor:default;}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.qid{font-size:12px;color:var(--slate);}
.errtag{font-size:12px;color:var(--seal);font-weight:700;}
.qtext{font-size:17px;margin-bottom:16px;white-space:pre-wrap;}
.progressbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:22px;}
.progressfill{height:100%;background:var(--gold);}
.exp-box{margin-top:14px;padding:13px 16px;background:#EFEAF5;border-left:3px solid var(--navy);border-radius:0 4px 4px 0;font-size:14px;color:#3a3650;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:13px;color:var(--slate);}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.checkbox-row:last-child{border-bottom:none;}
.timer{font-family:"SF Mono","Consolas",monospace;font-weight:700;}
.timer.low{color:var(--seal);}
.subj-tabs{display:flex;gap:8px;margin-bottom:18px;}

股價，此種分析是屬於：", "opts": ["技術分析", "價量分析", "基本分析", "系統分析。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q137", "flag": false, "tag": ""}, {"id": "inv2-q307", "q": "下列那一種評估合理股價的方法不是屬於基本分析方式：", "opts": ["政治及總體經濟因素", "各類產業環境之變動", "個別公司營運現況及預期", "股市每日成交價量變動。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q138", "flag": false, "tag": ""}, {"id": "inv2-q308", "q": "股利折現評價模式中的股利：", "opts": ["僅包括現金股利", "僅包括股票股利", "同時包括現金股利與股票股利", "即等於每股盈餘。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q139", "flag": false, "tag": ""}, {"id": "inv2-q309", "q": "A 公司考慮下列三種股利政策，何者無法利用股利折現評價模式計算該公司的股價：(A)3 元現金股利(B)2元現金股利及 1 元股票股利(C)3 元股票股利。", "opts": ["A 與B", "B 與 C", "A 與C", "A，B 與C。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q140", "flag": false, "tag": ""}, {"id": "inv2-q310", "q": "依股利折現評價模式時，其他情況不變，下列何種情況將使股票真實價值增加？", "opts": ["股利成長率下降且要求報酬率提高", "股利成長率與要求報酬率皆下降", "股利成長率提高且要求報酬率下降", "股利成長率與要求報酬率皆提高。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q141", "flag": false, "tag": ""}, {"id": "inv2-q311", "q": "依股利折現評價模式，若現金股利已知，投資人要求報酬率愈高，則投資人所評估股票的價格：", "opts": ["愈高", "愈低", "無法確定", "視折現期數而定。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q142", "flag": false, "tag": ""}, {"id": "inv2-q312", "q": "假設日月光半導體本年度每股分配現金股利 2.5元，且之後每年固定發放此金額。依該公司的營運及風險特性，市場人士認為該公司報酬率至少應有10%才願意投資，依此日月光股價應值多少？", "opts": ["15 元", "50 元", "25 元", "30 元。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q144", "flag": false, "tag": ""}, {"id": "inv2-q313", "q": "如果某公司每年固定發放 3 元的現金股利，在要求報酬率等於 10%的情況下，該公司的股票每股值 30元。若投資人要求報酬率上升，則該公司的每股股價：", "opts": ["上升", "下降", "不變", "不一定。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q145", "flag": false, "tag": ""}, {"id": "inv2-q314", "q": "某投資人計劃購買 X 股票，預期每年現金股利是 3 元，假設該投資人認為該股票應值50元，請問他所要求的報酬率為何？", "opts": ["5%", "6%", "3%", "10%。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q146", "flag": false, "tag": ""}, {"id": "inv2-q315", "q": "有一股利零成長的股票，剛發行 5 元股利，要求報酬率為 0.15，下一年的股利為多少元？", "opts": ["5.5 元", "5.75 元", "5 元", "6 元。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q147", "fla 301", "flag": false, "tag": ""}, {"id": "inv2-q439", "q": "一般而言，當投資標的之報酬率越大時，投資人所必須承擔的風險會如何改變：", "opts": ["越大", "越小", "不一定", "相同。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q302", "flag": false, "tag": ""}, {"id": "inv2-q440", "q": "假設某一投資人甲，其資金中 60%投資股票，預期報酬率為 20%，另外40%投資債券，預期報酬率為8%，股票的標準差為 15%，債券的標準差為5%，兩者之間的相關係數為-0.5。請問其投資組合預期報酬率為何？", "opts": ["12.8%", "15.2%", "14.4%", "16.4%。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q303", "flag": false, "tag": ""}, {"id": "inv2-q441", "q": "兩支股票的報酬之間無任何的關係，那麼該兩支股票報酬率的相關係數應為多少？", "opts": ["1", "0", "-1", ">0。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q304", "flag": false, "tag": ""}, {"id": "inv2-q442", "q": "隨著資產數目的增加，投資組合的風險會越來越取決於？", "opts": ["資產報酬率的變異數", "資產的投資報酬率", "資產報酬率之間的共變異數", "隨機的因素。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q305", "flag": false, "tag": ""}, {"id": "inv2-q443", "q": "以隨機方式組成證券投資組合，此時投資組合風險與證券種類之關係為：", "opts": ["證券種類越多，投資組合風險越高", "證券種類越多，投資組合風險越低", "依實證結果，二者並無明顯關係存在", "以上皆非。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q306", "flag": false, "tag": ""}, {"id": "inv2-q444", "q": "投資人之所以能藉著投資組合的方式分散掉一部分的風險，主要是因為：", "opts": ["證券的價格會一起漲一起跌", "證券的價格不會一起漲一起跌", "投資人很理性", "股票市場有效率。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q309", "flag": false, "tag": ""}, {"id": "inv2-q445", "q": "下列那一項對投資人來說屬於可分散的風險？", "opts": ["公司使用的原料價格", "公司外銷所得美元的匯率", "公司貸款的利率", "公司財產可能遭遇的天災。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q310", "flag": false, "tag": ""}, {"id": "inv2-q446", "q": "下列何者會增加投資人對該公司股票的必要報酬率？", "opts": ["公司決定購買更多的財產保險", "公司決定投入高昂的研發成本開發新電腦晶片", "公司經理人的經營效率很高", "中央銀行決定調高利率。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q312", "flag": false, "tag": ""}, {"id": "inv2-q447", "q": "有關市場投資組合的敘述何者正確？", "opts": ["市場投資組合包含了證券市場所有資產的投資組合", "市場投資組合的貝他係數定義為 1", "以上敘述皆為正確", "以上敘述皆為錯誤。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q313", "flag": false, "tag": ""}, {"id": "inv2-q448", "q": "下面哪一項不是市場投資組合的正確描述？", "opts": ["市場投資組合包含市場上所有的風險性資產", "市場投資組合基本上已不含有非系統性風險", "市場投資組合的風險比其它風險性資產的風險要低", "市場投資組合的貝他係數為1。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q315", "flag": false, "tag": ""}, {"id": "inv2-q449", "q": "以下對貝他係數之說法，何者為非？", "opts": ["β係數代表資產投資報酬率對市場的敏感度", "β係數為正，代表投資報酬率的變動與市場同向", "市場投資組合之β係數為零", "β係數可由迴歸分析求得。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q316", "flag": false, "tag": ""}, {"id": "inv2-q450", "q": "根據資本資產定價模型（CAPM）的公式，證券的貝他係數等於：", "opts": ["證券的期望報酬除以無風險利率", "證券的期望報酬除以市場投資組合的期望報酬", "證券的期望報酬除以市場投資組合的風險溢酬", "證券的期望報酬減掉無風險利率後，再除以市場投資組合的風險溢酬。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q317", "flag": false, "tag": ""}, {"id": "inv2-q451", "q": "投資組合之風險可以降低，主要是因為：", "opts": ["各證券之報酬率變異數有正有負", "時間報酬機率分配不同", "各證券之β值小於 0", "各證券之相關係數小於 1。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q318", "flag": false, "tag": ""}, {"id": "inv2-q452", "q": "投資組合在什麼時候不會產生風險分散的效益？當兩支股票的相關係數：", "opts": ["等於 1", "等於0", "等於-1", "以上皆是。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q319", "flag": false, "tag": ""}, {"id": "inv2-q453", "q": "什麼時候兩支股票所形成的可行集合會是一直線？當兩支股票的相關係數：", "opts": ["等於 1", "小於1", "小於 0", "等於-1。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q320", "flag": false, "tag": ""}, {"id": "inv2-q454", "q": "兩支股票所形成的效率集合或效率前緣等於其：", "opts": ["可行集合", "標準差最低之投資組合以上的可行集合", "標準差最低之投資組合以下的可行集合", "可行集合以外的區域。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q321", "flag": false, "tag": ""}, {"id": "inv2-q455", "q": "當市場上有多種證券時：", "opts": ["可行集合跟市場上只有兩種證券時一樣，是條曲線", "可行集合仍像兩資產的世界一樣容易地勾勒出來", "正如兩資產的世界，效率前緣上投資組合，其預期投資報酬率會比任何其他相等風險的投資組合的報酬率要來的高", "效率前緣是指可行集合中最低變異數的投資組合（MV 點）以下的左下邊緣。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q322", "flag": false, "tag": ""}, {"id": "inv2-q456", "q": "投資於國際股票市場之所以可能比只投資於單一國家的股市要來得好，主要是因為：", "opts": ["其他國家的股市可能比較有效率", "其他國家的股市可能比較沒有效率", "其他國家的股市可能投資報酬率比較高", "各國股市報酬率不是完全正相關。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q323", "flag": false, "tag": ""}, {"id": "inv2-q457", "q": "市場投資組合（efficientportofolio）與最低風險之投資組合（minimumvarianceportfolio），何者期望報酬率較高？", "opts": ["市場投資組合", "最低風險之投資組合", "一樣", "不一定。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q324", "flag": false, "tag": ""}, {"id": "inv2-q458", "q": "在資本資產定價模式中中，隱含貝他值（Beta）較高的資產會有較高的：", "opts": ["實際報酬率", "非系統風險", "價格", "以上皆非。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q325", "flag": false, "tag": ""}, {"id": "inv2-q459", "q": "在什麼樣的情形下，所有的投資人都只會持有由無風險投資與市場投資組合所組成的組合？", "opts": ["當風險性資產各不相關的時候", "當風險性資產彼此完全正相關時", "當風險性資產彼此完全負相關時", "當投資人對風險性資產的預期都相同時。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q326", "flag": false, "tag": ""}, {"id": "inv2-q460", "q": "無風險證券的報酬率標準差與貝他係數分別為：", "opts": ["0%，1", "0%，0", "6%，1", "6%，0。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q327", "flag": false, "tag": ""}, {"id": "inv2-q461", "q": "根據資本資產定價模型（CAPM），如果甲公司的貝他值大於一，則該公司的期望報酬率：", "opts": ["大於市場報酬率", "小於市場報酬率", "等於市場報酬率", "無法判斷。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q328", "flag": false, "tag": ""}, {"id": "inv2-q462", "q": "根據資本資產定價模型（CAPM），如果乙投資人購買貝他值為 1 的股票，則他的期望報酬率：", "opts": ["等於市場報酬率", "大於市場報酬率", "小於市場報酬率", "無法判斷。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q329", "flag": false, "tag": ""}, {"id": "inv2-q463", "q": "根據資本資產定價模型（CAPM），如果丙投資人購買貝他值為 0.88 的股票，則他的期望報酬率：", "opts": ["等於市場報酬率", "大於市場報酬率", "小於市場報酬率", "無法判斷。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q330", "flag": false, "tag": ""}, {"id": "inv2-q464", "q": "何種情形會使得證券市場線（SML）整條線的移動：", "opts": ["貝他值上升", "貝他值下降", "無風險利率上升", "以上皆非。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q331", "flag": false, "tag": ""}, {"id": "inv2-q465", "q": "當市場期望通貨膨脹率下降時，若其他條件不變下，無風險利率會下降，因此將使證券市場線（SML）:", "opts": ["斜率變大（即變陡）", "斜率變小", "平行往上移動", "平行往下移動。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q332", "flag": false, "tag": ""}, {"id": "inv2-q466", "q": "關於證券市場線（SML）的敘述，下列何者正確：", "opts": ["SML 的斜率愈陡，表示投資人的風險趨避程度愈小", "若其他條件不變下，無風險利率會升高，因此將使證券市場線平行移動", "若其他條件不變下，投資人風險趨避程度的改變，這是在證券市場線上之點的移動", "當貝他值改變時，期望報酬率也隨之變動，這是在證券市場線上平行移動。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q333", "flag": false, "tag": ""}, {"id": "inv2-q467", "q": "關於資本資產定價模式（CAPM）中，所有投資組合皆會：", "opts": ["提供相同的報酬率", "和效率投資組合落在同一條線上", "提供相同的市場風險", "均落在證券市場線上。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q334", "flag": false, "tag": ""}, {"id": "inv2-q468", "q": "如果有資產是在證券市場線之上方：", "opts": ["眾人會競相購買此資產", "眾人會競相拋售此資產", "此資產的貝他係數大於 1", "此資產的貝他係數小於1。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q335", "flag": false, "tag": ""}, {"id": "inv2-q469", "q": "下列有關證券市場線的敘述何者錯誤：", "opts": ["可做為評估股票預期報酬的參考", "可以協助計算投資組合報酬率的標準差", "可以表達出股票的預期報酬與β之間的關係", "在均衡的市場中，所有證券的風險與報酬都落在這條線上。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q337", "flag": false, "tag": ""}, {"id": "inv2-q470", "q": "有關資本資產定價理論，下列敘述何者錯誤？", "opts": ["只有承擔系統性風險可獲得風險溢酬", "系統性風險可以β值來衡量", "所有人均只會持有無風險性資產與市場投資組合兩種", "效率前緣為雙曲線之一支。"], "ans": 4, "err": null, "exp": "來源：經典第二科11205 Q339", "flag": false, "tag": ""}, {"id": "inv2-q471", "q": "資本資產定價模型（CAPM）中，證券的風險溢酬取決於：", "opts": ["市場投資組合的風險溢酬", "市場投資組合的風險溢酬與證券的貝他係數", "無風險利率與證券的貝他係數", "市場投資組合的報酬率。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q340", "flag": false, "tag": ""}, {"id": "inv2-q472", "q": "根據資本資產定價模型（CAPM），如果 A 公司的貝他值為1.3，市場風險溢酬為5%，無風險利率為3%。若無風險利率下降為 2%，其他條件不變下，請問該公司的期望報酬率：", "opts": ["增加", "減少", "不變", "無法判斷。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q342", "flag": false, "tag": ""}, {"id": "inv2-q473", "q": "根據資本資產定價模型（CAPM），如果 C 公司的貝他值為0.98，市場風險溢酬為5%，無風險利率為3.2%。若無風險利率上升為 4%，其他條件不變下， 請問該公司的期望報酬率：", "opts": ["增加", "減少", "不變", "無法判斷。"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q343", "flag": false, "tag": ""}, {"id": "inv2-q474", "q": "根據資本資產定價模型（CAPM），如果 B 公司的貝他值為1.3，無風險利率為3%，其期望報酬率為9.5%。若無風險利率上升為 5%，其他條件不變下， 請問該公司的期望報酬率：", "opts": ["上升 1%", "上升2%", "下降%", "無法判斷"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q344", "flag": false, "tag": ""}, {"id": "inv2-q475", "q": "如果投資人的風險趨避程度變大，因此將使證券市場線 SML：", "opts": ["平行移動", "斜率改變", "線上點的移動", "無法判斷。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q345", "flag": false, "tag": ""}, {"id": "inv2-q476", "q": "甲基金過去平均報酬率為 15%，標準差為 20%；乙基金過去平均報酬率為 20%，標準差為30%。無風險利率為 10%。以夏普（sharp）指標評估二者績效，則哪一基金表現較好？", "opts": ["甲", "乙", "一樣", "資訊不足無法比較。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q346", "flag": false, "tag": ""}, {"id": "inv2-q477", "q": "某投資者計劃投資期間為一年，則對該投資者來說，下列哪一種為無風險證券？", "opts": ["一年到期之公司債", "一年到期之國庫券", "銀行 6 個月定存單", "30 天到期之國庫券。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q347", "flag": false, "tag": ""}, {"id": "inv2-q478", "q": "根據資本資產定價理論（CAPM），若短期政府公債利率為 3%，市場投資組合之風險溢價為4%，貝他係數（(3)為 1.5，則證券的期望報酬為多少？", "opts": ["6%", "4.5%", "9%", "7%。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q348", "flag": false, "tag": ""}, {"id": "inv2-q479", "q": "假設證券A 的期望報酬率等於 20%，無風險利率等於 5%，證券 A的貝他係數等於1.2，請問根據資本資產定價模型（CAPM），市場投資組合的期望報酬率等於：", "opts": ["6%", "16.67%", "17.50%", "24%。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q349", "flag": false, "tag": ""}, {"id": "inv2-q480", "q": "假設華碩的β為 1.2，在無風險利率為 4%、市場預期報酬為 10%的條件下，依CAPM，其預期報酬應為多少？", "opts": ["10.50%", "11.20%", "12.30%", "13.50%"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q350", "flag": false, "tag": ""}, {"id": "inv2-q481", "q": "—投資組合的期望報酬率為 17%，貝他值為 1.5，市場期望報酬率為 14%，根據CAPM模式，無風險利率為多少？", "opts": ["8%", "10%", "5%", "12%"], "ans": 1, "err": null, "exp": "來源：經典第二科11205 Q352", "flag": false, "tag": ""}, {"id": "inv2-q482", "q": "依據CAPM 若市場上之 A 股票的預期報酬率為 14%，市場預期報酬率為 17%， 國庫券利率為 5%，則A股票的貝他係數β為何？", "opts": ["0.5", "0.65", "0.75", "0.85。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q353", "flag": false, "tag": ""}, {"id": "inv2-q483", "q": "在CAPM 模式中，若貝他β值減少，則證券市場線應？", "opts": ["平行上移", "平行下移", "保持不變", "與原來 SML 成垂直。"], "ans": 3, "err": null, "exp": "來源：經典第二科11205 Q354", "flag": false, "tag": ""}, {"id": "inv2-q484", "q": "夏普指標和崔諾指標二者的差異為：", "opts": ["超額報酬率的計算方式不同", "衡量風險的方法不同", "評估期間的長短不同", "以上皆非。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q355", "flag": false, "tag": ""}, {"id": "inv2-q485", "q": "以下何者為非？", "opts": ["夏普指標關心投資人面臨的總風險", "資訊比例關心投資組合的系統風險", "詹森指標反映基金經理人的選股能力", "崔諾指標關心投資人的貝他（β）風險。"], "ans": 2, "err": null, "exp": "來源：經典第二科11205 Q356", "flag": false, "tag": ""}, {"id": "inv2-q486", "q": "夏普指 <script>
(function(){

var subjects = QUESTION_DATA.subjects;
var state = {
  subjectIdx:0,
  screen:'home',
  mode:null,
  queue:[],
  idx:0,
  selected:null,
  revealed:false,
  correctCount:0,
  wrongCount:0,
  freeChapters:{},
  freeCount:30,
  mockCount:50,
  timeLeft:0,
  timerHandle:null,
  stats:{}
};

function currentSubject(){ return subjects[state.subjectIdx]; }

function allQuestionsOf(subject){
  var out = [];
  subject.chapters.forEach(function(ch){
    ch.questions.forEach(function(q){
      out.push({ id:q.id, chNum:ch.num, chName:ch.name, q:q.q, opts:q.opts, ans:q.ans, err:(q.err==null?(q.flag?45:30):q.err), exp:q.exp, tag:q.tag });
    });
  });
  return out;
}

function resetFreeChapters(){
  state.freeChapters = {};
  currentSubject().chapters.forEach(function(ch){ state.freeChapters[ch.num]=true; });
}
resetFreeChapters();

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}

function storageKey(){ return currentSubject().subjectKey+'-question-stats'; }

async function loadStats(){
  try{
    var r = null; try{ var raw = localStorage.getItem(storageKey()); if(raw) r = {value: raw}; }catch(e){}
    state.stats = r && r.value ? JSON.parse(r.value) : {};
  }catch(e){ state.stats = {}; }
}
async function saveStats(){
  try{ localStorage.setItem(storageKey(), JSON.stringify(state.stats)); }catch(e){}
}
function recordAnswer(id, correct){
  var s = state.stats[id] || {seen:0, wrong:0};
  s.seen += 1;
  if(!correct) s.wrong += 1;
  state.stats[id] = s;
  saveStats();
}

function chapterRiskData(){
  var subj = currentSubject();
  var all = allQuestionsOf(subj);
  return subj.chapters.map(function(ch){
    var qs = all.filter(function(q){return q.chNum===ch.num;});
    var officialAvg = 0;
    var seenSum=0, wrongSum=0;
    qs.forEach(function(q){
      var s = state.stats[q.id];
      if(s && s.seen>0){ seenSum+=s.seen; wrongSum+=s.wrong; }
    });
    var personal = seenSum>0 ? (wrongSum/seenSum*100) : null;
    return {num:ch.num, name:ch.name, count:qs.length, officialAvg:officialAvg, personal:personal};
  });
}

function barColor(val){
  if(val>=50) return 'var(--seal)';
  if(val>=30) return 'var(--gold)';
  return 'var(--jade)';
}

function render(){
  var app = document.getElementById('app');
  if(state.screen==='home') app.innerHTML = renderHome();
  else if(state.screen==='setupFree') app.innerHTML = renderSetupFree();
  else if(state.screen==='setupMock') app.innerHTML = renderSetupMock();
  else if(state.screen==='quiz') app.innerHTML = renderQuiz();
  else if(state.screen==='summary') app.innerHTML = renderSummary();
  bindEvents();
}

function subjectTabs(){
  return '<div class="subj-tabs">'+ subjects.map(function(s,i){
    return '<button class="subj-tab'+(i===state.subjectIdx?' active':'')+'" data-action="switchSubject" data-i="'+i+'">'+s.subject+'</button>';
  }).join('') + '</div>';
}

function renderHome(){
  var subj = currentSubject();
  var risk = chapterRiskData();
  var anyData = risk.some(function(r){return r.personal!==null;});
  var rows = risk.map(function(r){
    var val = r.personal!==null ? r.personal : r.officialAvg;
    var label = r.personal!==null ? Math.round(r.personal)+'%' : '—';
    var color = r.personal!==null ? barColor(r.personal) : 'var(--line)';
    return '<div class="chapter-row">'+
      '<div class="chapter-name">第'+r.num+'章 '+r.name+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+Math.min(val,100)+'%;background:'+(r.personal!==null?color:'var(--gold-dim)')+'"></div></div>'+
      '<div class="bar-val stat-num" style="color:'+(r.personal!==null?color:'var(--slate)')+'">'+label+'</div>'+
    '</div>';
  }).join('');

  return ''+
  subjectTabs()+
  '<div class="eyebrow">'+subj.eyebrow+'</div>'+
  '<h1 style="font-size:26px;margin-bottom:4px;">應考練習　風險評估</h1>'+
  '<p style="color:var(--slate);font-size:14px;margin-top:6px;margin-bottom:20px;">題庫 '+allQuestionsOf(subj).length+' 題　·　官方考試 '+subj.officialQuestions+' 題 / '+subj.officialMinutes+' 分鐘　·　'+subj.passText+'</p>'+
  '<div class="card">'+
    '<h3 style="font-size:15px;margin-bottom:12px;color:var(--navy);">個人風險評估表'+(anyData?'':'　<span style="font-size:12px;color:var(--slate);font-weight:400;">(尚無作答紀錄，作答後會顯示各章錯誤率)</span>')+'</h3>'+
    rows+
  '</div>'+
  '<div class="card">'+
    '<h3 style="font-size:15px;margin-bottom:10px;color:var(--navy);">選擇練習模式</h3>'+
    '<div class="btn-row" style="flex-direction:column;align-items:stretch;">'+
      '<button class="btn" data-action="goFree">自由練習　選章節作答</button>'+
      '<button class="btn secondary" data-action="goWeak">弱點複習　依錯誤率加權出題</button>'+
      '<button class="btn secondary" data-action="goMock">模擬考　計時作答</button>'+
    '</div>'+
  '</div>';
}

function renderSetupFree(){
  var subj = currentSubject();
  var rows = subj.chapters.map(function(ch){
    var checked = state.freeChapters[ch.num] ? 'checked' : '';
    return '<label class="checkbox-row"><input type="checkbox" data-chnum="'+ch.num+'" '+checked+'> 第'+ch.num+'章 '+ch.name+' ('+ch.questions.length+'題)</label>';
  }).join('');
  return ''+
  subjectTabs()+
  '<div class="eyebrow">'+subj.subject+' · 自由練習</div>'+
  '<h2 style="margin-bottom:14px;">選擇要練習的章節</h2>'+
  '<div class="card">'+rows+'</div>'+
  '<div class="card">'+
    '<label style="font-size:14px;color:var(--slate);">本次練習題數</label><br>'+
    '<select id="freeCountSel" style="margin-top:8px;padding:8px;font-size:14px;border:1px solid var(--line);border-radius:4px;">'+
      [10,20,30,50,'all'].map(function(n){
        var label = n==='all' ? '全部（已選章節）' : n+' 題';
        var sel = (state.freeCount===n) ? 'selected':'';
        return '<option value="'+n+'" '+sel+'>'+label+'</option>';
      }).join('')+
    '</select>'+
  '</div>'+
  '<div class="btn-row">'+
    '<button class="btn" data-action="startFree">開始練習</button>'+
    '<button class="btn secondary" data-action="backHome">返回</button>'+
  '</div>';
}

function renderSetupMock(){
  var subj = currentSubject();
  return ''+
  subjectTabs()+
  '<div class="eyebrow">'+subj.subject+' · 模擬考</div>'+
  '<h2 style="margin-bottom:14px;">設定模擬考規模</h2>'+
  '<div class="card">'+
    '<p style="font-size:14px;color:var(--slate);margin-top:0;">官方正式考試為 '+subj.officialQuestions+' 題、'+subj.officialMinutes+' 分鐘。題庫共 '+allQuestionsOf(subj).length+' 題，可從中隨機抽題，計時將依比例換算。</p>'+
    '<label style="font-size:14px;">題數</label><br>'+
    '<select id="mockCountSel" style="margin-top:8px;padding:8px;font-size:14px;border:1px solid var(--line);border-radius:4px;">'+
      [25,50,75,Math.min(100, allQuestionsOf(subj).length)].map(function(n){
        var sel=(state.mockCount===n)?'selected':'';
        return '<option value="'+n+'" '+sel+'>'+n+' 題</option>';
      }).join('')+
    '</select>'+
  '</div>'+
  '<div class="btn-row">'+
    '<button class="btn" data-action="startMock">開始計時作答</button>'+
    '<button class="btn secondary" data-action="backHome">返回</button>'+
  '</div>';
}

function renderQuiz(){
  var q = state.queue[state.idx];
  var pct = Math.round((state.idx)/state.queue.length*100);
  var timerHtml = '';
  if(state.mode==='mock'){
    var m = Math.floor(state.timeLeft/60), s = state.timeLeft%60;
    var low = state.timeLeft < 120;
    timerHtml = '<span class="timer'+(low?' low':'')+'">⏱ '+m+':'+(s<10?'0':'')+s+'</span>';
  }
  var optsHtml = q.opts.map(function(opt,i){
    var cls = 'opt';
    if(state.revealed){
      cls += ' disabled-look';
      if(i+1===q.ans) cls += ' correct';
      else if(i+1===state.selected) cls += ' wrong';
    } else if(state.selected===i+1){
      cls += ' selected';
    }
    return '<button class="'+cls+'" data-action="pick" data-i="'+(i+1)+'" '+(state.revealed?'disabled':'')+'>('+ 'ABCD'.charAt(i) +') '+opt+'</button>';
  }).join('');

  var expHtml = '';
  if(state.revealed && q.exp){
    expHtml = '<div class="exp-box"><b>解析：</b>'+q.exp+'</div>';
  } else if(state.revealed && !q.exp){
    expHtml = '<div class="exp-box">正確答案如上標示。</div>';
  }

  return ''+
  '<div class="topbar">'+
    '<span>'+currentSubject().subject+'　第 '+(state.idx+1)+' / '+state.queue.length+' 題</span>'+
    timerHtml+
  '</div>'+
  '<div class="progressbar"><div class="progressfill" style="width:'+pct+'%"></div></div>'+
  '<div class="card">'+
    '<div class="qmeta"><span class="qid">'+q.id+'　第'+q.chNum+'章 '+q.chName+'</span>'+(q.tag?'<span class="errtag">'+q.tag+'</span>':'')+'</div>'+
    '<div class="qtext">'+q.q+'</div>'+
    optsHtml+
    expHtml+
  '</div>'+
  '<div class="btn-row">'+
    (state.revealed ?
      '<button class="btn" data-action="next">'+(state.idx+1<state.queue.length?'下一題':'查看結果')+'</button>'
      : '<button class="btn secondary" data-action="quit">結束本次練習</button>')+
  '</div>';
}

function renderSummary(){
  var total = state.correctCount+state.wrongCount;
  var pct = total>0 ? Math.round(state.correctCount/total*100) : 0;
  var pass = pct>=currentSubject().passScore;
  return ''+
  subjectTabs()+
  '<div class="eyebrow">'+currentSubject().subject+' · 本次練習結果</div>'+
  '<div class="card" style="display:flex;align-items:center;gap:18px;">'+
    '<div class="seal-badge'+(pass?' pass':'')+'">'+(pass?'通過':'再加油')+'</div>'+
    '<div>'+
      '<div style="font-size:30px;font-weight:700;" class="stat-num">'+pct+'<span style="font-size:16px;color:var(--slate);">分（換算100分制）</span></div>'+
      '<div style="color:var(--slate);font-size:14px;">共作答 '+total+' 題　答對 '+state.correctCount+' 題　答錯 '+state.wrongCount+' 題</div>'+
    '</div>'+
  '</div>'+
  '<p style="font-size:13px;color:var(--slate);">'+currentSubject().passNote+'</p>'+
  '<div class="btn-row">'+
    '<button class="btn" data-action="goWeak">繼續弱點複習</button>'+
    '<button class="btn secondary" data-action="backHome">回首頁看風險評估</button>'+
  '</div>';
}

function startTimer(totalSeconds){
  state.timeLeft = totalSeconds;
  if(state.timerHandle) clearInterval(state.timerHandle);
  state.timerHandle = setInterval(function(){
    state.timeLeft -= 1;
    if(state.timeLeft<=0){
      clearInterval(state.timerHandle);
      finishSession();
      return;
    }
    var t = document.querySelector('.timer');
    if(t){
      var m = Math.floor(state.timeLeft/60), s = state.timeLeft%60;
      t.classList.toggle('low', state.timeLeft<120);
      t.innerHTML = '⏱ '+m+':'+(s<10?'0':'')+s;
    }
  },1000);
}
function stopTimer(){ if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle=null; } }

function buildWeakQueue(n){
  var all = allQuestionsOf(currentSubject());
  var scored = all.map(function(q){
    var s = state.stats[q.id];
    var personalRate = (s && s.seen>0) ? (s.wrong/s.seen*100) : null;
    var score = personalRate!==null ? (personalRate*0.65 + q.err*0.35) : q.err;
    return {q:q, score:score};
  });
  scored.sort(function(a,b){return b.score-a.score;});
  var poolSize = Math.max(n*2, Math.ceil(scored.length*0.5));
  var pool = scored.slice(0, Math.min(poolSize, scored.length)).map(function(x){return x.q;});
  shuffle(pool);
  return pool.slice(0, Math.min(n, pool.length));
}

function resetSession(){
  state.idx=0; state.selected=null; state.revealed=false;
  state.correctCount=0; state.wrongCount=0;
}

function finishSession(){
  stopTimer();
  state.screen='summary';
  render();
}

function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(function(node){
    node.addEventListener('click', function(){
      var action = node.getAttribute('data-action');
      if(action==='switchSubject'){
        var i = Number(node.getAttribute('data-i'));
        if(i!==state.subjectIdx){
          stopTimer();
          state.subjectIdx = i;
          resetFreeChapters();
          state.screen='home';
          loadStats().then(render);
        }
      }
      else if(action==='goFree'){ state.screen='setupFree'; render(); }
      else if(action==='goWeak'){
        state.mode='weak'; state.queue=buildWeakQueue(20); resetSession(); state.screen='quiz'; render();
      }
      else if(action==='goMock'){ state.screen='setupMock'; render(); }
      else if(action==='backHome'){ stopTimer(); state.screen='home'; render(); }
      else if(action==='startFree'){
        var chosen = Object.keys(state.freeChapters).filter(function(k){return state.freeChapters[k];}).map(Number);
        var pool = allQuestionsOf(currentSubject()).filter(function(q){return chosen.indexOf(q.chNum)>-1;});
        shuffle(pool);
        if(state.freeCount!=='all'){ pool = pool.slice(0, state.freeCount); }
        state.mode='free'; state.queue=pool; resetSession(); state.screen='quiz'; render();
      }
      else if(action==='startMock'){
        var subj = currentSubject();
        var pool = allQuestionsOf(subj);
        shuffle(pool);
        pool = pool.slice(0, state.mockCount);
        state.mode='mock'; state.queue=pool; resetSession(); state.screen='quiz';
        render();
        var totalSeconds = Math.round(subj.officialMinutes*60*state.mockCount/subj.officialQuestions);
        startTimer(totalSeconds);
      }
      else if(action==='pick'){
        if(state.revealed) return;
        var i = Number(node.getAttribute('data-i'));
        state.selected = i;
        state.revealed = true;
        var q = state.queue[state.idx];
        var correct = (i===q.ans);
        if(correct) state.correctCount++; else state.wrongCount++;
        recordAnswer(q.id, correct);
        render();
      }
      else if(action==='next'){
        if(state.idx+1 < state.queue.length){
          state.idx++; state.selected=null; state.revealed=false; render();
        } else {
          finishSession();
        }
      }
      else if(action==='quit'){ finishSession(); }
    });
  });

  document.querySelectorAll('[data-chnum]').forEach(function(cb){
    cb.addEventListener('change', function(){
      state.freeChapters[Number(cb.getAttribute('data-chnum'))] = cb.checked;
    });
  });
  var fsel = document.getElementById('freeCountSel');
  if(fsel) fsel.addEventListener('change', function(){
    state.freeCount = fsel.value==='all' ? 'all' : Number(fsel.value);
  });
  var msel = document.getElementById('mockCountSel');
  if(msel) msel.addEventListener('change', function(){
    state.mockCount = Number(msel.value);
  });
}

loadStats().then(render);

})();

</script>
</body>
</html>
